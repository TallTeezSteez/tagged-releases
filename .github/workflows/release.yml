name: Release Tagged for Windows
# Builds the Tagged desktop app (the app/ folder: the small window around the live site, no Tagged
# app code) and publishes it as a release in this repo with the repo's own GITHUB_TOKEN. Public
# repos get free build minutes. Start it from Actions -> Release Tagged for Windows -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, like 1.0.1 (higher than the last release)'
        required: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - name: Check the version
        env:
          V: ${{ inputs.version }}
        run: '[[ "${V#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version: $V"; exit 1; }'
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Set the version
        env:
          V: ${{ inputs.version }}
        run: npm version "${V#v}" --no-git-tag-version --allow-same-version
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
